<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1600px; height: 420px;
    background:
      radial-gradient(700px 360px at 8% -10%, #1b2a55 0%, transparent 60%),
      radial-gradient(700px 360px at 100% 120%, #0b3b46 0%, transparent 55%),
      #070b14;
    color: #e8eefc;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .row { display: flex; gap: 20px; }
  .item { width: 250px; text-align: center; }
  .item img { width: 236px; height: 236px; border-radius: 53px; box-shadow: 0 22px 50px rgba(0,0,0,.5); }
  .cap { margin-top: 16px; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .num { color: #5eead4; margin-right: 7px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><img src="v1-classic.svg"><div class="cap"><span class="num">01</span>Классика 2.0</div></div>
    <div class="item"><img src="v2-crystal.svg"><div class="cap"><span class="num">02</span>Кристалл</div></div>
    <div class="item"><img src="v3-orbit.svg"><div class="cap"><span class="num">03</span>Орбита</div></div>
    <div class="item"><img src="v4-monogram.svg"><div class="cap"><span class="num">04</span>Монограмма</div></div>
    <div class="item"><img src="v5-neon.svg"><div class="cap"><span class="num">05</span>Неон</div></div>
    <div class="item"><img src="v6-crystal-u.svg"><div class="cap"><span class="num">06</span>Кристалл × U</div></div>
  </div>
</body>
</html>
