name: Daily digest

on:
  schedule:
    # 06:00 UTC = 09:00 Moscow
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect issues and pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const digestTitle = "Р•Р¶РµРґРЅРµРІРЅР°СЏ СЃРІРѕРґРєР° РїРѕ issues Рё PR";
            const now = new Date();
            const since = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();

            const updated = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              since,
              per_page: 100,
            });

            const issues = updated.filter(
              (item) => !item.pull_request && item.title !== digestTitle,
            );
            const pulls = updated.filter((item) => item.pull_request);

            const line = (item) => {
              const labels = item.labels.map((label) => label.name).join(", ");
              return `- [#${item.number}](${item.html_url}) ${item.title} вЂ” @${item.user.login}${labels ? ` В· ${labels}` : ""}`;
            };

            const list = (items) =>
              items.length ? items.map(line).join("\n") : "_РќРµС‚ РЅРѕРІС‹С… РёР»Рё РѕР±РЅРѕРІР»С‘РЅРЅС‹С… Р·Р° СЃСѓС‚РєРё._";

            const date = now.toLocaleDateString("ru-RU", {
              timeZone: "Europe/Moscow",
              day: "numeric",
              month: "long",
              year: "numeric",
            });

            const body = [
              `## РЎРІРѕРґРєР° Р·Р° ${date}`,
              "",
              `**Issues:** ${issues.length} В· **Pull requests:** ${pulls.length}`,
              "",
              "### Issues",
              list(issues),
              "",
              "### Pull requests",
              list(pulls),
              "",
              "---",
              `@${owner}, РїСЂРѕРІРµСЂСЊ РЅРѕРІС‹Рµ РѕС‚С‡С‘С‚С‹. Р”Р»СЏ СЂР°Р·Р±РѕСЂР° Р»РѕРіРѕРІ, РєРѕРґР° Рё РїСЂРёРѕСЂРёС‚РµС‚РѕРІ РЅР°РїРёС€Рё РІ OpenCode: В«СЂР°Р·Р±РµСЂРё СЃРІРµР¶СѓСЋ СЃРІРѕРґРєСѓВ».`,
            ].join("\n");

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const digest = open.find(
              (item) => !item.pull_request && item.title === digestTitle,
            );

            if (digest) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: digest.number,
                body,
              });
              core.info(`Comment added to #${digest.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: digestTitle,
                body: `${body}\n\nР­С‚РѕС‚ issue СЃРѕР·РґР°С‘С‚СЃСЏ Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРё Рё РѕР±РЅРѕРІР»СЏРµС‚СЃСЏ СЂР°Р· РІ РґРµРЅСЊ. Р—Р°РєСЂРµРїРё РµРіРѕ, С‡С‚РѕР±С‹ СЃРІРѕРґРєР° Р±С‹Р»Р° РїРѕРґ СЂСѓРєРѕР№.`,
                labels: ["daily-digest"],
              });
              core.info(`Created #${created.data.number}`);
            }

